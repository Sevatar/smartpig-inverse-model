[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpig-inverse-model"
version = "0.1.0"
description = "Untrained TensorFlow/Keras SmartPIG inverse-model architecture"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["tensorflow>=2.16.2,<2.21"]

[tool.setuptools.packages.find]
where = ["src"]
